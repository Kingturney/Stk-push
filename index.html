<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Payment | Request Money from Customers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .status.pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            display: block;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .phone-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            💸 Request Payment
        </h1>
        <p class="subtitle">Customer pays via M-Pesa STK Push</p>
        
        <form id="paymentForm">
            <div class="form-group">
                <label>📱 Customer Phone Number</label>
                <input type="tel" id="phone" placeholder="254712345678" required>
                <div class="phone-hint">Format: 254XXXXXXXXX (e.g., 254712345678)</div>
            </div>
            
            <div class="form-group">
                <label>💰 Amount (KES)</label>
                <input type="number" id="amount" placeholder="e.g., 500" min="1" required>
            </div>
            
            <div class="form-group">
                <label>📝 Description (Optional)</label>
                <textarea id="description" rows="2" placeholder="e.g., Order #1234, Service Payment..."></textarea>
            </div>
            
            <button type="submit" id="payBtn">
                💳 Pay Now via M-Pesa
            </button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // Replace with your actual backend URL
        const API_BASE_URL = 'http://localhost:3000/api';
        
        const form = document.getElementById('paymentForm');
        const payBtn = document.getElementById('payBtn');
        const statusDiv = document.getElementById('status');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value;
            
            // Basic validation
            if (!phone || !amount) {
                showStatus('Please fill in all required fields', 'error');
                return;
            }
            
            if (!phone.match(/^254[0-9]{9}$/)) {
                showStatus('Phone number must be in format: 254XXXXXXXXX (e.g., 254712345678)', 'error');
                return;
            }
            
            if (amount < 1) {
                showStatus('Amount must be at least 1 KES', 'error');
                return;
            }
            
            // Disable button and show loading
            payBtn.disabled = true;
            payBtn.innerHTML = '<span class="loading-spinner"></span> Processing...';
            showStatus('Initiating payment request...', 'pending');
            
            try {
                const response = await fetch(`${API_BASE_URL}/stk-push`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone: phone,
                        amount: parseInt(amount),
                        description: description || 'Payment via Website'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus(
                        `✅ STK Push sent! Check your phone (${phone}) for the M-Pesa prompt.\nEnter your PIN to complete payment.\n\nTransaction ID: ${data.checkoutRequestID || 'Processing...'}`,
                        'success'
                    );
                    form.reset();
                    
                    // Start polling for payment status if we have transaction ID
                    if (data.checkoutRequestID) {
                        startPolling(data.checkoutRequestID);
                    }
                } else {
                    showStatus(`❌ Failed: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Network error. Please check if your backend server is running.', 'error');
            } finally {
                payBtn.disabled = false;
                payBtn.innerHTML = '💳 Pay Now via M-Pesa';
            }
        });
        
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        async function startPolling(checkoutRequestID) {
            let attempts = 0;
            const maxAttempts = 30; // Poll for 60 seconds (2 sec intervals)
            
            const pollInterval = setInterval(async () => {
                attempts++;
                
                try {
                    const response = await fetch(`${API_BASE_URL}/payment-status/${checkoutRequestID}`);
                    const data = await response.json();
                    
                    if (data.status === 'SUCCESS') {
                        clearInterval(pollInterval);
                        showStatus(
                            `🎉 Payment successful! Amount: KES ${data.amount || '?'}\nReceipt: ${data.receiptNumber || 'N/A'}\nThank you for your payment!`,
                            'success'
                        );
                    } else if (data.status === 'FAILED') {
                        clearInterval(pollInterval);
                        showStatus(`❌ Payment failed. ${data.message || 'Please try again.'}`, 'error');
                    }
                    
                    if (attempts >= maxAttempts) {
                        clearInterval(pollInterval);
                        showStatus('⏳ Payment still processing. You will receive an SMS confirmation shortly.', 'pending');
                    }
                } catch (err) {
                    // Silently fail polling - don't spam errors
                }
            }, 2000);
        }
    </script>
</body>
  </html>
